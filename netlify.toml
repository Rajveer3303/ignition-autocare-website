[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years, include subdomains, eligible for browser preload list
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Prevent the site being embedded in iframes on other domains (clickjacking)
    X-Frame-Options = "SAMEORIGIN"

    # Stop browsers guessing file types (MIME sniffing attacks)
    X-Content-Type-Options = "nosniff"

    # Don't leak full URL in Referer header when following external links
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Block access to camera, mic, and location unless explicitly granted
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Content Security Policy — allows Next.js, GTM, and Google Fonts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://tagassistant.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://book.ignitionautocare.uk https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://*.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://*.doubleclick.net https://www.facebook.com https://connect.facebook.net https://capig.stape.io; frame-src https://www.googletagmanager.com https://challenges.cloudflare.com https://td.doubleclick.net https://*.doubleclick.net https://tagassistant.google.com https://www.facebook.com; object-src 'none'; base-uri 'self'"
