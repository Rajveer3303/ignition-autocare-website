[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ignitionautocare.co.uk is the primary domain. The .uk domain stays attached as
# an alias but permanently redirects, page for page, so search engines see one site.
[[redirects]]
  from = "https://ignitionautocare.uk/*"
  to = "https://ignitionautocare.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ignitionautocare.uk/*"
  to = "https://ignitionautocare.co.uk/:splat"
  status = 301
  force = true

# Addresses from the old BookMyGarage site on ignitionautocare.co.uk. Google
# results and the Google Ads sitelinks still point at these, so send each one to
# its new page. Netlify keeps the query string (gclid, utm_*) on the redirect.
[[redirects]]
  from = "/servicing/*"
  to = "/car-servicing"
  status = 301
  force = true

[[redirects]]
  from = "/servicing"
  to = "/car-servicing"
  status = 301
  force = true

